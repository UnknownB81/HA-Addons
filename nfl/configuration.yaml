sensor:
  - platform: rest
    name: NFL Classement Brut
    unique_id: nfl_standings_raw
    resource: https://site.web.api.espn.com/apis/v2/sports/football/nfl/standings?seasontype=2&level=3
    scan_interval: 21600   # 6h : le classement ne change pas souvent
    value_template: "OK"
    json_attributes:
      - children

  - platform: rest
    name: NFL Classement Pre-saison Brut
    unique_id: nfl_preseason_standings_raw
    resource: https://site.web.api.espn.com/apis/v2/sports/football/nfl/standings?seasontype=1&level=3
    scan_interval: 21600
    value_template: "OK"
    json_attributes:
      - children
 
  - platform: rest
    name: NFL Scores Bruts
    unique_id: nfl_scores_raw
    resource_template: >-
      https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates={{ now().strftime('%Y%m%d') }}-{{ (now() + timedelta(days=14)).strftime('%Y%m%d') }}
    scan_interval: 300     # 5 min : pour suivre les matchs en direct
    value_template: "OK"
    json_attributes:
      - events
 
# ---------- 2) CAPTEURS TEMPLATE (données aplaties, faciles à afficher) ----------
template:
  - sensor:
      - name: "NFL Classement Complet"
        unique_id: nfl_standings_flat
        state: "{{ states('sensor.nfl_classement_brut') }}"
        attributes:
          teams: >-
            {% set ns = namespace(teams=[]) %}
            {% for conf in state_attr('sensor.nfl_classement_brut','children') or [] %}
              {% for div in conf.children %}
                {% for entry in div.standings.entries %}
                  {% set wins_l = entry.stats | selectattr('name','eq','wins') | map(attribute='displayValue') | list %}
                  {% set losses_l = entry.stats | selectattr('name','eq','losses') | map(attribute='displayValue') | list %}
                  {% set pct_l = entry.stats | selectattr('name','eq','winPercent') | map(attribute='displayValue') | list %}
                  {% set ns.teams = ns.teams + [{
                    'conference': conf.name,
                    'division': div.name,
                    'team': entry.team.displayName,
                    'wins': wins_l[0] | int(0) if wins_l else 0,
                    'losses': losses_l[0] | int(0) if losses_l else 0,
                    'pct': pct_l[0] | float(0) if pct_l else 0
                  }] %}
                {% endfor %}
              {% endfor %}
            {% endfor %}
            {{ ns.teams }}

      - name: "NFL Classement Pre-saison"
        unique_id: nfl_preseason_standings_flat
        state: "{{ states('sensor.nfl_classement_pre_saison_brut') }}"
        attributes:
          teams: >-
            {% set ns = namespace(teams=[]) %}
            {% for conf in state_attr('sensor.nfl_classement_pre_saison_brut','children') or [] %}
              {% for div in conf.children %}
                {% for entry in div.standings.entries %}
                  {% set wins_l = entry.stats | selectattr('name','eq','wins') | map(attribute='displayValue') | list %}
                  {% set losses_l = entry.stats | selectattr('name','eq','losses') | map(attribute='displayValue') | list %}
                  {% set pct_l = entry.stats | selectattr('name','eq','winPercent') | map(attribute='displayValue') | list %}
                  {% set ns.teams = ns.teams + [{
                    'conference': conf.name,
                    'division': div.name,
                    'team': entry.team.displayName,
                    'wins': wins_l[0] | int(0) if wins_l else 0,
                    'losses': losses_l[0] | int(0) if losses_l else 0,
                    'pct': pct_l[0] | float(0) if pct_l else 0
                  }] %}
                {% endfor %}
              {% endfor %}
            {% endfor %}
            {{ ns.teams }}
 
      - name: "NFL Classement Global"
        unique_id: nfl_standings_global
        state: "{{ states('sensor.nfl_classement_complet') }}"
        attributes:
          teams: >-
            {% set standings = state_attr('sensor.nfl_classement_complet', 'teams') or [] %}
            {% set sorted_teams = standings | sort(attribute='losses') | sort(attribute='pct', reverse=true) | sort(attribute='wins', reverse=true) %}
            {% set ns = namespace(teams=[]) %}
            {% for team in sorted_teams %}
              {% set ns.teams = ns.teams + [team | combine({'rank': loop.index})] %}
            {% endfor %}
            {{ ns.teams }}

      - name: "NFL Matchs Du Jour"
        unique_id: nfl_games_today
        state: >-
          {{ ((state_attr('sensor.nfl_scores_bruts','events') or [])
              | selectattr('season.type', 'eq', 2) | list) | length }}
        attributes:
          games: >-
            {% set ns = namespace(games=[]) %}
            {% for event in state_attr('sensor.nfl_scores_bruts','events') or [] %}
              {% if event.season.type | int == 2 %}
              {% set comp = event.competitions[0] %}
              {% set home = comp.competitors | selectattr('homeAway','eq','home') | first %}
              {% set away = comp.competitors | selectattr('homeAway','eq','away') | first %}
              {% set ns.games = ns.games + [{
                'date': as_timestamp(event.date) | timestamp_custom('%a %d %b, %H:%M', true),
                'away_team': away.team.abbreviation,
                'away_logo': away.team.logo,
                'away_score': away.score,
                'home_team': home.team.abbreviation,
                'home_logo': home.team.logo,
                'home_score': home.score,
                'status': comp.status.type.shortDetail,
                'venue': comp.venue.fullName if comp.venue is defined else '',
                'broadcast': comp.broadcasts[0].names | join(', ') if comp.broadcasts is defined and comp.broadcasts else ''
              }] %}
              {% endif %}
            {% endfor %}
            {{ ns.games }}

      - name: "NFL Matchs Pre-saison"
        unique_id: nfl_preseason_games_today
        state: >-
          {{ ((state_attr('sensor.nfl_scores_bruts','events') or [])
              | selectattr('season.type', 'eq', 1) | list) | length }}
        attributes:
          games: >-
            {% set ns = namespace(games=[]) %}
            {% for event in state_attr('sensor.nfl_scores_bruts','events') or [] %}
              {% if event.season.type | int == 1 %}
              {% set comp = event.competitions[0] %}
              {% set home = comp.competitors | selectattr('homeAway','eq','home') | first %}
              {% set away = comp.competitors | selectattr('homeAway','eq','away') | first %}
              {% set ns.games = ns.games + [{
                'date': as_timestamp(event.date) | timestamp_custom('%a %d %b, %H:%M', true),
                'away_team': away.team.abbreviation,
                'away_logo': away.team.logo,
                'away_score': away.score,
                'home_team': home.team.abbreviation,
                'home_logo': home.team.logo,
                'home_score': home.score,
                'status': comp.status.type.shortDetail,
                'venue': comp.venue.fullName if comp.venue is defined else '',
                'broadcast': comp.broadcasts[0].names | join(', ') if comp.broadcasts is defined and comp.broadcasts else ''
              }] %}
              {% endif %}
            {% endfor %}
            {{ ns.games }}